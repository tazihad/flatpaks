app-id: org.fcitx.Fcitx5.Addon.OpenBangla
branch: stable
runtime: org.fcitx.Fcitx5
runtime-version: stable
sdk: org.kde.Sdk//6.11
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-extension: true
separate-locales: false
build-options:
  prefix: /app/addons/OpenBangla
  prepend-path: /app/addons/OpenBangla/bin
  prepend-pkg-config-path: /app/addons/OpenBangla/lib/pkgconfig
  prepend-ld-library-path: /app/addons/OpenBangla/lib
  append-path: /usr/lib/sdk/rust-stable/bin
  no-debuginfo: true
  strip: true
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /lib/cmake
  - /share/cmake
  - '*.la'
  - '*.a'
modules:
  - name: fcitx5-openbangla
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      env:
        CARGO_HOME: /run/build/fcitx5-openbangla/cargo
        CARGO_NET_OFFLINE: "true"
      append-path: /usr/lib/sdk/rust-stable/bin
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_FCITX=ON
      - -DENABLE_GUI=ON
      - -DCMAKE_BUILD_WITH_INSTALL_RPATH=TRUE
      - -DCMAKE_INSTALL_RPATH=/app/addons/OpenBangla/lib
    post-install:
      - |
        for size in 16 32 48 128 512; do
          if [ -f "data/${size}.png" ]; then
            install -Dm644 "data/${size}.png" "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/openbangla-keyboard.png"
          fi
        done
    sources:
      - type: git
        url: https://github.com/OpenBangla/OpenBangla-Keyboard.git
        commit: eea66aff18ac14cc43fa1273afd68729be5b5e67
      - type: file
        path: riti-Cargo.lock
        dest: src/engine/riti
        dest-filename: Cargo.lock
      - ./cargo-sources-riti.json
      - ./cargo-sources-platform.json
      - type: patch
        path: docs/probes/0001-engine-only-ENABLE_GUI.patch
      - type: patch
        path: docs/probes/0002-qt6-port.diff
      - type: patch
        path: docs/patches/obk/0001-fcitx-fix-crash-with-two-input-contexts-lost-words-a.patch
      - type: patch
        path: docs/patches/obk/0002-frontend-show-the-tray-icon-when-running-inside-Flat.patch
      - type: patch
        path: docs/patches/riti/0001-Fix-crash-and-doubled-values-in-suffix-derived-selec.patch
        options: [-d, src/engine/riti]
      - type: patch
        path: docs/patches/riti/0002-Don-t-abort-the-input-method-on-damaged-or-unwritabl.patch
        options: [-d, src/engine/riti]
